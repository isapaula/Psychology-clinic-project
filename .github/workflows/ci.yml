name: CI

on: 
    push: 
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    backend:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do código
              uses: actions/checkout@v4
            
            - name: Configurar PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: '8.2'
            
            - name: Instalar dependências
              run: composer install --no-interaction --prefer-dist
